[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-ros"
version = "0.2.0"
description = "Small, application-independent ROS 2 client"
requires-python = ">=3.11"
authors = [{name = "Mateusz Pomianek"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
